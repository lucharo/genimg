[project]
name = "genimg"
version = "0.1.0"
description = "Multi-provider image generation CLI (Gemini + OpenAI)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "skills/genimg-infographic/LICENSE"]
dependencies = [
  # typer<0.26: 0.26 dropped its top-level click dep AND refactored TyperGroup,
  # breaking _DefaultGroup's default-command routing (cli.py). click is pinned
  # directly because cli.py imports it (not transitively via typer).
  "typer>=0.12,<0.26",
  "click>=8.1",
  # 1.51 added GenerateContentConfig.thinking_level, used by Gemini 3.1 Flash Image.
  "google-genai>=1.51",
  "openai>=1.50",
  "rich>=13",
  "pillow>=10",
  "pydantic>=2.7",
  "httpx>=0.27",
  "questionary>=2.0",
  "textual>=8,<9",
  "textual-image[textual]>=0.13.2,<0.14 ; python_full_version >= '3.12'",
  "c2pa-python>=0.37.10,<0.38",
  "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/lucharo/genimg"
Documentation = "https://lucharo.github.io/genimg/"
Source = "https://github.com/lucharo/genimg"
Issues = "https://github.com/lucharo/genimg/issues"

[project.scripts]
genimg = "genimg.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
docs = [
    "zensical>=0.0.62",
]

[tool.ruff]
line-length = 88
indent-width = 2

[tool.ruff.lint]
# Lint only, no style enforcement: pyflakes (F, real bugs) + import sorting (I).
# Deliberately no E501/line-length — the code is intentionally not wrapped to 88.
select = ["F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Review evidence stays in Git, outside the distributable package.
exclude = ["/artifacts", "/handoffs"]

[tool.hatch.build.targets.wheel]
packages = ["src/genimg"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "genimg/_skills"
