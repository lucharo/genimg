[project]
name = "genimg"
version = "0.1.0"
description = "Multi-provider image generation CLI (Gemini + OpenAI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "google-genai>=0.8",
  "openai>=1.50",
  "rich>=13",
  "pillow>=10",
  "pydantic>=2.7",
  "httpx>=0.27",
  "questionary>=2.0",
]

[project.scripts]
genimg = "genimg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genimg"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "genimg/_skills"
